<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Shop</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font:16px Arial;
  background:#f5f5f5;
  color:#222
}
header{
  padding:16px 6%;
  background:#111;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center
}
main{
  max-width:1000px;
  margin:30px auto;
  padding:0 16px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px
}
.card{
  background:white;
  padding:14px;
  border-radius:10px;
  box-shadow:0 2px 8px #0001
}
.pic{
  height:140px;
  background:#eee;
  border-radius:8px;
  display:grid;
  place-items:center;
  font-size:48px
}
.price{
  font-weight:bold;
  margin:8px 0
}
button{
  border:0;
  background:#111;
  color:white;
  padding:9px 12px;
  border-radius:6px;
  cursor:pointer
}
</style>
</head>

<body>

<header>
  <strong>Mini Shop</strong>
  <span id="cart">Cart: 0</span>
</header>

<main>
  <h1>Products</h1>
  <div class="grid" id="products"></div>
</main>

<script>
const items = [
  ["T-Shirt","👕",19],
  ["Sneakers","👟",49],
  ["Backpack","🎒",35],
  ["Headphones","🎧",29]
];

let cart = 0;

document.getElementById("products").innerHTML =
  items.map(p => `
    <article class="card">
      <div class="pic">${p[1]}</div>
      <h3>${p[0]}</h3>
      <div class="price">$${p[2]}</div>
      <button onclick="addToCart()">Add to cart</button>
    </article>
  `).join("");

function addToCart(){
  cart++;
  document.getElementById("cart").textContent = "Cart: " + cart;
}
</script>

</body>
</html>
